apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  namespace: argocd
  name: cluster-boostrap-eks-production
spec:
  destination:
    name: in-cluster
    namespace: argocd
  source:
    path: boostrap
    repoURL: >-
      https://github.com/Eric-hys/EKS-Demo
    targetRevision: HEAD
  project: default
  syncPolicy:
    syncOptions:
      - PrunePropagationPolicy=Foreground
